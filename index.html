<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Звёздный путь — космическая игра</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: radial-gradient(ellipse at center, #0b1a3a 0%, #000 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #gameWrap {
    position: relative;
    width: 900px;
    max-width: 95vw;
    aspect-ratio: 9/6;
    border: 2px solid #4af;
    border-radius: 18px;
    box-shadow: 0 0 40px #4af, inset 0 0 40px rgba(74,170,255,0.2);
    overflow: hidden;
    background: #000;
  }
  canvas { display: block; width: 100%; height: 100%; }

  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,10,30,0.85);
    backdrop-filter: blur(6px);
    text-align: center;
    padding: 20px;
    z-index: 10;
  }
  .hidden { display: none !important; }

  h1 {
    font-size: clamp(28px, 5vw, 54px);
    background: linear-gradient(90deg,#4af,#f4a,#ff4);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(74,170,255,0.5);
    margin-bottom: 10px;
    letter-spacing: 2px;
  }
  h2 { font-size: clamp(20px, 3vw, 32px); margin-bottom: 20px; color:#9cf; }
  p { font-size: 16px; margin: 8px 0; color:#cde; max-width: 600px; }

  input[type=text] {
    padding: 12px 18px;
    font-size: 18px;
    border-radius: 10px;
    border: 2px solid #4af;
    background: rgba(0,0,0,0.5);
    color: #fff;
    outline: none;
    margin: 15px 0;
    width: 280px;
    text-align: center;
  }
  input[type=text]:focus { box-shadow: 0 0 15px #4af; }

  button {
    padding: 12px 30px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    background: linear-gradient(90deg,#4af,#f4a);
    color: #fff;
    margin: 8px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 0 20px rgba(74,170,255,0.6);
  }
  button:hover { transform: scale(1.05); box-shadow: 0 0 30px #4af; }
  button:active { transform: scale(0.98); }

  #hud {
    position: absolute;
    top: 10px; left: 10px; right: 10px;
    display: flex; justify-content: space-between;
    font-size: 18px; font-weight: bold;
    text-shadow: 0 0 8px #4af;
    pointer-events: none;
    z-index: 5;
  }
  #musicBtn {
    position: absolute;
    top: 10px; right: 10px;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    border: 2px solid #4af;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    z-index: 20;
  }
  #certCanvas {
    max-width: 90%;
    max-height: 60vh;
    border: 2px solid #fc0;
    border-radius: 10px;
    box-shadow: 0 0 30px #fc0;
  }
  .controls { font-size: 14px; color:#9cf; margin-top: 15px; }
</style>
</head>
<body>

<div id="gameWrap">
  <canvas id="game"></canvas>
  <button id="musicBtn" title="Вкл/выкл музыку">🔊</button>

  <div id="hud" class="hidden">
    <div>⭐ <span id="score">0</span> / <span id="target">5</span></div>
    <div>Уровень: <span id="level">1</span>/3</div>
    <div>❤️ <span id="lives">3</span></div>
  </div>

  <!-- Стартовый экран -->
  <div id="startScreen" class="overlay">
    <h1>🚀 ЗВЁЗДНЫЙ ПУТЬ</h1>
    <h2>Космический квест</h2>
    <p>Собирай звёзды, избегай астероидов и пройди все 3 уровня, чтобы получить именной сертификат!</p>
    <input type="text" id="playerName" placeholder="Введите ваше имя" maxlength="20">
    <button id="startBtn">🎮 Начать игру</button>
    <p class="controls">Управление: ← ↑ → ↓ или WASD, либо мышь</p>
  </div>

  <!-- Экран победы -->
  <div id="winScreen" class="overlay hidden">
    <h1>🏆 ПОБЕДА!</h1>
    <h2>Ваш именной сертификат</h2>
    <canvas id="certCanvas" width="800" height="560"></canvas>
    <div style="margin-top:15px;">
      <button id="downloadBtn">📥 Скачать сертификат</button>
      <button id="replayBtn">🔄 Играть снова</button>
    </div>
  </div>

  <!-- Экран поражения -->
  <div id="loseScreen" class="overlay hidden">
    <h1>💥 Корабль уничтожен</h1>
    <p>Не сдавайтесь — космос ждёт героя!</p>
    <button id="retryBtn">🔁 Попробовать снова</button>
  </div>
</div>

<script>
/* =========================================================
   ЗВЁЗДНЫЙ ПУТЬ — игра на Canvas
   ========================================================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  const rect = canvas.getBoundingClientRect();
  canvas.width = W = rect.width;
  canvas.height = H = rect.height;
}
window.addEventListener('resize', resize);
resize();

/* ---------- Фоновая музыка (Web Audio API) ---------- */
let audioCtx = null;
let musicOn = true;
let musicNodes = [];
let musicTimer = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

// Простая зацикленная мелодия в тональности A minor
const melody = [
  [440.00, 0.4], // A4
  [523.25, 0.4], // C5
  [659.25, 0.4], // E5
  [523.25, 0.4],
  [493.88, 0.4], // B4
  [440.00, 0.4],
  [392.00, 0.4], // G4
  [329.63, 0.8], // E4
  [392.00, 0.4],
  [440.00, 0.4],
  [523.25, 0.4],
  [392.00, 0.8],
];
const bass = [
  [110.00, 0.8], // A2
  [130.81, 0.8], // C3
  [146.83, 0.8], // D3
  [110.00, 0.8],
];

function playNote(freq, duration, type='sine', volume=0.08, startOffset=0) {
  if (!audioCtx || !musicOn) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  const t0 = audioCtx.currentTime + startOffset;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(volume, t0 + 0.02);
  gain.gain.linearRampToValueAtTime(0, t0 + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.05);
  musicNodes.push(osc);
}

function playMusicLoop() {
  if (!musicOn) return;
  let t = 0;
  melody.forEach(([f, d]) => {
    playNote(f, d * 0.95, 'triangle', 0.07, t);
    t += d;
  });
  let tb = 0;
  while (tb < t) {
    bass.forEach(([f, d]) => {
      if (tb < t) playNote(f, d * 0.95, 'sine', 0.05, tb);
      tb += d;
    });
  }
  musicTimer = setTimeout(playMusicLoop, t * 1000);
}

function startMusic() {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  musicOn = true;
  document.getElementById('musicBtn').textContent = '🔊';
  playMusicLoop();
}
function stopMusic() {
  musicOn = false;
  document.getElementById('musicBtn').textContent = '🔇';
  if (musicTimer) clearTimeout(musicTimer);
}
function toggleMusic() {
  if (musicOn) stopMusic(); else startMusic();
}
document.getElementById('musicBtn').addEventListener('click', toggleMusic);

/* ---------- Звуковые эффекты ---------- */
function sfx(freq, dur=0.15, type='square', vol=0.1) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}

/* ---------- Игровые объекты ---------- */
const levels = [
  { target: 5,  asteroids: 3,  speed: 1.5, name: 'Пояс астероидов' },
  { target: 8,  asteroids: 6,  speed: 2.3, name: 'Туманность Ориона' },
  { target: 12, asteroids: 10, speed: 3.0, name: 'Чёрная дыра' },
];

const player = { x:0, y:0, r:16, speed:5, trail: [] };
let stars = [];
let asteroids = [];
let particles = [];
let bgStars = [];
let currentLevel = 0;
let score = 0;
let lives = 3;
let keys = {};
let mouse = { x: null, y: null, active: false };
let gameState = 'menu'; // menu | playing | win | lose
let levelTransition = 0;
let playerName = '';

/* ---------- Звёздное небо (фон) ---------- */
function initBgStars() {
  bgStars = [];
  for (let i = 0; i < 120; i++) {
    bgStars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.5 + 0.3,
      s: Math.random() * 0.5 + 0.2,
      a: Math.random()
    });
  }
}

/* ---------- Инициализация уровня ---------- */
function startLevel(n) {
  currentLevel = n;
  const L = levels[n];
  score = 0;
  stars = [];
  asteroids = [];
  particles = [];
  player.x = W / 2;
  player.y = H / 2;
  player.trail = [];

  // Генерируем звёзды
  for (let i = 0; i < L.target; i++) {
    stars.push({
      x: 60 + Math.random() * (W - 120),
      y: 60 + Math.random() * (H - 120),
      r: 10,
      pulse: Math.random() * Math.PI * 2,
      collected: false
    });
  }
  // Генерируем астероиды
  for (let i = 0; i < L.asteroids; i++) {
    spawnAsteroid();
  }

  updateHUD();
  levelTransition = 120;
}

function spawnAsteroid() {
  const L = levels[currentLevel];
  const side = Math.floor(Math.random() * 4);
  let x, y, vx, vy;
  const sp = L.speed * (0.7 + Math.random() * 0.8);
  if (side === 0) { x = -20; y = Math.random()*H; vx = sp; vy = (Math.random()-0.5)*sp; }
  else if (side === 1) { x = W+20; y = Math.random()*H; vx = -sp; vy = (Math.random()-0.5)*sp; }
  else if (side === 2) { x = Math.random()*W; y = -20; vx = (Math.random()-0.5)*sp; vy = sp; }
  else { x = Math.random()*W; y = H+20; vx = (Math.random()-0.5)*sp; vy = -sp; }
  asteroids.push({
    x, y, vx, vy,
    r: 14 + Math.random() * 14,
    rot: Math.random() * Math.PI * 2,
    vr: (Math.random() - 0.5) * 0.05,
    bumps: Array.from({length: 8}, () => 0.7 + Math.random() * 0.5)
  });
}

/* ---------- Управление ---------- */
document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - rect.left) * (canvas.width / rect.width);
  mouse.y = (e.clientY - rect.top) * (canvas.height / rect.height);
  mouse.active = true;
});
canvas.addEventListener('mouseleave', () => { mouse.active = false; });

/* ---------- Обновление ---------- */
function update() {
  if (gameState !== 'playing') return;

  // Движение игрока
  let dx = 0, dy = 0;
  if (keys['arrowleft'] || keys['a']) dx -= 1;
  if (keys['arrowright'] || keys['d']) dx += 1;
  if (keys['arrowup'] || keys['w']) dy -= 1;
  if (keys['arrowdown'] || keys['s']) dy += 1;

  if (mouse.active && !dx && !dy) {
    const mdx = mouse.x - player.x;
    const mdy = mouse.y - player.y;
    const md = Math.hypot(mdx, mdy);
    if (md > 3) { dx = mdx / md; dy = mdy / md; }
  }

  const len = Math.hypot(dx, dy);
  if (len > 0) { dx /= len; dy /= len; }
  player.x += dx * player.speed;
  player.y += dy * player.speed;
  player.x = Math.max(player.r, Math.min(W - player.r, player.x));
  player.y = Math.max(player.r, Math.min(H - player.r, player.y));

  // След
  player.trail.push({ x: player.x, y: player.y, a: 1 });
  if (player.trail.length > 20) player.trail.shift();
  player.trail.forEach(t => t.a *= 0.9);

  // Звёзды
  stars.forEach(s => {
    if (s.collected) return;
    s.pulse += 0.1;
    const d = Math.hypot(s.x - player.x, s.y - player.y);
    if (d < s.r + player.r) {
      s.collected = true;
      score++;
      sfx(880, 0.15, 'sine', 0.15);
      sfx(1320, 0.15, 'sine', 0.1);
      for (let i = 0; i < 15; i++) {
        particles.push({
          x: s.x, y: s.y,
          vx: (Math.random()-0.5)*5,
          vy: (Math.random()-0.5)*5,
          life: 1, color: '#ff4'
        });
      }
      updateHUD();
      if (score >= levels[currentLevel].target) {
        // Следующий уровень
        if (currentLevel < levels.length - 1) {
          setTimeout(() => startLevel(currentLevel + 1), 800);
        } else {
          setTimeout(winGame, 800);
        }
      }
    }
  });

  // Астероиды
  asteroids.forEach(a => {
    a.x += a.vx;
    a.y += a.vy;
    a.rot += a.vr;
    // Респавн, если улетел
    if (a.x < -50 || a.x > W + 50 || a.y < -50 || a.y > H + 50) {
      Object.assign(a, spawnAsteroidData());
    }
    // Столкновение
    const d = Math.hypot(a.x - player.x, a.y - player.y);
    if (d < a.r + player.r - 4) {
      lives--;
      sfx(120, 0.4, 'sawtooth', 0.2);
      for (let i = 0; i < 25; i++) {
        particles.push({
          x: player.x, y: player.y,
          vx: (Math.random()-0.5)*8,
          vy: (Math.random()-0.5)*8,
          life: 1, color: '#f44'
        });
      }
      // Отбросить
      player.x = W / 2; player.y = H / 2;
      player.trail = [];
      updateHUD();
      if (lives <= 0) loseGame();
    }
  });

  // Частицы
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.96; p.vy *= 0.96;
    p.life -= 0.02;
  });
  particles = particles.filter(p => p.life > 0);

  // Фоновые звёзды
  bgStars.forEach(s => {
    s.y += s.s;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    s.a = 0.5 + Math.sin(Date.now() * 0.003 + s.x) * 0.5;
  });

  if (levelTransition > 0) levelTransition--;
}

function spawnAsteroidData() {
  const L = levels[currentLevel];
  const side = Math.floor(Math.random() * 4);
  const sp = L.speed * (0.7 + Math.random() * 0.8);
  let x, y, vx, vy;
  if (side === 0) { x = -20; y = Math.random()*H; vx = sp; vy = (Math.random()-0.5)*sp; }
  else if (side === 1) { x = W+20; y = Math.random()*H; vx = -sp; vy = (Math.random()-0.5)*sp; }
  else if (side === 2) { x = Math.random()*W; y = -20; vx = (Math.random()-0.5)*sp; vy = sp; }
  else { x = Math.random()*W; y = H+20; vx = (Math.random()-0.5)*sp; vy = -sp; }
  return {
    x, y, vx, vy,
    r: 14 + Math.random() * 14,
    rot: Math.random() * Math.PI * 2,
    vr: (Math.random() - 0.5) * 0.05,
    bumps: Array.from({length: 8}, () => 0.7 + Math.random() * 0.5)
  };
}

/* ---------- Отрисовка ---------- */
function draw() {
  // Фон
  const grad = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, Math.max(W,H));
  grad.addColorStop(0, '#0a1a4a');
  grad.addColorStop(1, '#000');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Фоновые звёзды
  bgStars.forEach(s => {
    ctx.globalAlpha = s.a;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  if (gameState !== 'playing') return;

  // Звёзды-цели
  stars.forEach(s => {
    if (s.collected) return;
    const pulse = 1 + Math.sin(s.pulse) * 0.2;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.pulse * 0.3);
    ctx.shadowColor = '#ff4';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#ff4';
    drawStar(0, 0, 5, s.r * pulse, s.r * pulse * 0.5);
    ctx.fill();
    ctx.restore();
  });

  // Астероиды
  asteroids.forEach(a => {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);
    ctx.shadowColor = '#a64';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#8a5a3a';
    ctx.strokeStyle = '#5a3a1a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < a.bumps.length; i++) {
      const ang = (i / a.bumps.length) * Math.PI * 2;
      const r = a.r * a.bumps[i];
      const x = Math.cos(ang) * r;
      const y = Math.sin(ang) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  });

  // След игрока
  player.trail.forEach((t, i) => {
    ctx.globalAlpha = t.a * 0.5;
    ctx.fillStyle = '#4af';
    ctx.beginPath();
    ctx.arc(t.x, t.y, player.r * (i / player.trail.length) * 0.8, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Игрок (корабль)
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.shadowColor = '#4af';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#4af';
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, -player.r);
  ctx.lineTo(player.r * 0.8, player.r * 0.8);
  ctx.lineTo(0, player.r * 0.4);
  ctx.lineTo(-player.r * 0.8, player.r * 0.8);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // Кабина
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, 0, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Частицы
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Переход уровня
  if (levelTransition > 0) {
    ctx.globalAlpha = Math.min(1, levelTransition / 60);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 42px Segoe UI';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#4af';
    ctx.shadowBlur = 20;
    ctx.fillText(`Уровень ${currentLevel + 1}: ${levels[currentLevel].name}`, W/2, H/2);
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }
}

function drawStar(cx, cy, spikes, outerR, innerR) {
  let rot = Math.PI / 2 * 3;
  let x = cx, y = cy;
  const step = Math.PI / spikes;
  ctx.beginPath();
  ctx.moveTo(cx, cy - outerR);
  for (let i = 0; i < spikes; i++) {
    x = cx + Math.cos(rot) * outerR;
    y = cy + Math.sin(rot) * outerR;
    ctx.lineTo(x, y);
    rot += step;
    x = cx + Math.cos(rot) * innerR;
    y = cy + Math.sin(rot) * innerR;
    ctx.lineTo(x, y);
    rot += step;
  }
  ctx.lineTo(cx, cy - outerR);
  ctx.closePath();
}

/* ---------- HUD ---------- */
function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('target').textContent = levels[currentLevel].target;
  document.getElementById('level').textContent = currentLevel + 1;
  document.getElementById('lives').textContent = lives;
}

/* ---------- Состояния игры ---------- */
function startGame() {
  const name = document.getElementById('playerName').value.trim() || 'Космонавт';
  playerName = name;
  lives = 3;
  currentLevel = 0;
  gameState = 'playing';
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  initBgStars();
  startLevel(0);
  startMusic();
}

function winGame() {
  gameState = 'win';
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('winScreen').classList.remove('hidden');
  generateCertificate();
  sfx(523, 0.2, 'sine', 0.2);
  setTimeout(() => sfx(659, 0.2, 'sine', 0.2), 200);
  setTimeout(() => sfx(784, 0.4, 'sine', 0.2), 400);
}

function loseGame() {
  gameState = 'lose';
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('loseScreen').classList.remove('hidden');
}

function resetToMenu() {
  gameState = 'menu';
  document.getElementById('winScreen').classList.add('hidden');
  document.getElementById('loseScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
  stopMusic();
}
